<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Acadêmico UFMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Cabeçalho do Chat -->
    <header class="chat-header">
      <div class="header-brand">
        <div class="bot-avatar" aria-hidden="true">UFMS</div>
        <div class="header-info">
          <h1 id="bot-title">Assistente Acadêmico UFMS</h1>
          <span class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Online • Secretaria Acadêmica</span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <!-- Botão Dark Mode -->
        <button type="button" id="theme-toggle-btn" class="header-btn" title="Alternar tema">
          🌓
        </button>
        <!-- Botão Limpar -->
        <button type="button" id="clear-chat-btn" class="header-btn" title="Limpar conversa">
          Limpar
        </button>
      </div>
    </header>

    <!-- Estrutura com Chat e Sidebar -->
    <div class="content-wrapper">
      
      <!-- Miolo do Chat -->
      <div class="chat-main">
        <main class="chat-messages" id="chat-messages" aria-live="polite">
          <!-- Mensagens inseridas via JavaScript -->
        </main>

        <footer class="chat-footer">
          <form id="chat-form" class="chat-input-form" autocomplete="off">
            <input
              type="text"
              id="user-input"
              placeholder="Digite sua dúvida (ex: como fazer rematrícula?)..."
              maxlength="500"
              required
              aria-label="Digite sua dúvida acadêmica"
            />
            <button type="submit" id="send-btn" aria-label="Enviar mensagem">
              <span>Enviar</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </footer>
      </div>

      <!-- Barra Lateral de Temas Recorrentes -->
      <aside class="sidebar-themes" aria-label="Temas mais buscados">
        <div class="sidebar-header">Mais Buscados</div>
        <div class="topics-list" id="sidebar-topics-container">
          <!-- Botões injetados via JS dinamicamente pelo ranking -->
        </div>
      </aside>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
