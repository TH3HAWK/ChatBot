<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Acadêmico UFMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Cabeçalho do Chat -->
    <header class="chat-header">
      <div class="header-brand">
        <div class="bot-avatar" aria-hidden="true">UFMS</div>
        <div class="header-info">
          <h1 id="bot-title">Assistente Acadêmico UFMS</h1>
          <span class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Online • Secretaria Acadêmica</span>
          </span>
        </div>
      </div>
      <button type="button" id="clear-chat-btn" class="clear-btn" title="Limpar conversa">
        Limpar
      </button>
    </header>

    <!-- Barra de Atalhos Rápidos -->
    <section class="quick-topics" aria-label="Sugestões de assuntos">
      <div class="topics-scroll" id="topics-container">
        <button class="topic-chip" data-query="Como fazer matrícula e rematrícula?">Matrícula</button>
        <button class="topic-chip" data-query="Emitir histórico escolar e declaração">Histórico / Declaração</button>
        <button class="topic-chip" data-query="Como funciona o trancamento?">Trancamento</button>
        <button class="topic-chip" data-query="Documentação de estágio">Estágio</button>
        <button class="topic-chip" data-query="Aproveitamento de estudos">Aproveitamento</button>
        <button class="topic-chip" data-query="Qual o calendário acadêmico?">Calendário</button>
        <button class="topic-chip" data-query="Passe estudantil e carteirinha">Passe / Carteirinha</button>
        <button class="topic-chip" data-query="Telefone e contato da secretaria">Contatos</button>
      </div>
    </section>

    <!-- Área de Mensagens -->
    <main class="chat-messages" id="chat-messages" aria-live="polite">
      <!-- Mensagens inseridas via JavaScript -->
    </main>

    <!-- Formulário de Envio -->
    <footer class="chat-footer">
      <form id="chat-form" class="chat-input-form" autocomplete="off">
        <input
          type="text"
          id="user-input"
          placeholder="Digite sua dúvida (ex: como fazer rematrícula?)..."
          maxlength="500"
          required
          aria-label="Digite sua dúvida acadêmica"
        />
        <button type="submit" id="send-btn" aria-label="Enviar mensagem">
          <span>Enviar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
