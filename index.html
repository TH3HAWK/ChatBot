<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Acadêmico UFMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    
    <!-- Cabeçalho do Chat -->
    <header class="chat-header">
      <div class="header-brand">
        <div class="bot-avatar" aria-hidden="true">UFMS</div>
        <div class="header-info">
          <h1 id="bot-title">Assistente Acadêmico</h1>
          <span class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Online • Secretaria</span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="theme-toggle-btn" class="header-btn" title="Alternar tema">
          🌓
        </button>
        <button type="button" id="clear-chat-btn" class="header-btn" title="Limpar conversa">
          Limpar
        </button>
      </div>
    </header>

    <!-- Miolo do Chat -->
    <main class="chat-messages" id="chat-messages" aria-live="polite">
      <!-- Mensagens inseridas via JavaScript -->
    </main>

    <!-- Rodapé com Input e Menu Flutuante -->
    <footer class="chat-footer">
      
      <!-- Menu Oculto de Temas Frequentes -->
      <div class="trending-menu" id="trending-menu">
        <div class="trending-header">Buscas Frequentes</div>
        <div class="topics-list" id="topics-list-container">
          <!-- Botões injetados dinamicamente via JS -->
        </div>
      </div>

      <form id="chat-form" class="chat-input-form" autocomplete="off">
        <!-- Botão "+" de acesso ao menu oculto -->
        <button type="button" id="toggle-trending-btn" class="icon-btn" title="Temas Frequentes" aria-label="Temas Frequentes">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <input
          type="text"
          id="user-input"
          placeholder="Digite sua dúvida (ex: rematrícula)..."
          maxlength="500"
          required
          aria-label="Digite sua dúvida acadêmica"
        />
        
        <button type="submit" id="send-btn" class="send-btn" aria-label="Enviar mensagem">
          <span>Enviar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
